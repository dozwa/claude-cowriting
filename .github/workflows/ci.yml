name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git config --global user.name ci && git config --global user.email ci@example.org
      - run: python3 -m unittest discover -s plugin/tests -p 'test_*.py' -v

  tracker:
    name: Release tracker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/tracker.py check

  plugin:
    name: Plugin hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate plugin
      - run: claude plugin test plugin
